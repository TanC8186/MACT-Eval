# teacher-web 的 nginx 配置（正式入口，127.0.0.1:3000）。
#
# 本文件在镜像里被复制为 /etc/nginx/templates/default.conf.template，
# 由 nginx 官方的 20-envsubst-on-templates.sh 在容器启动时渲染到
# /etc/nginx/conf.d/default.conf（已在本机镜像里确认该脚本与 envsubst 都存在）。
# 只有出现在容器环境里的 ${VAR} 会被替换，nginx 自己的 $host / $uri 等
# **不受影响**——envsubst 的替换清单是从 ENVIRON 取的，不是正则通配。
#
# ── 安全响应头（SEC-01，2026-10-28）的三个设计决定 ──────────────────────
#
# 1) **每条策略只写一次**，用 `set` 变量在各处引用。
#    原因：nginx 的 add_header 继承是"全有或全无"——子块里只要出现一条
#    add_header，父块那一整套就全部失效。因此每个自带 add_header 的 location
#    都必须重复整套；而"重复 8 条、共 3 处"意味着改一处忘两处，最终每个
#    location 的策略各不相同。浏览器对多条 CSP 取**交集**，于是实际生效的策略
#    比任何一条都严，故障表现为"某个资源被拦截"且无人能指出是谁的策略。
#    用变量后，三处引用的永远是同一个字符串。
#
# 2) `/api/` **刻意让两条 CSP 同时到达浏览器**（不 hide 后端那份）。
#    后端发的是 `default-src 'none'; frame-ancestors 'none'; sandbox`——
#    针对 JSON 的锁定策略；本文件发的是页面策略。两者交集 = 锁定策略，
#    而锁定策略正是 JSON 响应该有的语义（不该加载任何子资源、不该被执行）。
#    此前设想用 proxy_hide_header 去掉后端那份，那会让 /api/ 只剩**页面**
#    策略——对 JSON 而言是更弱的策略，而且与 MockMvc 断言的那条不一致。
#
# 3) 所有 add_header 都带 `always`。
#    不带时 4xx/5xx 不带安全头，而错误页恰恰是最容易被嵌进 iframe 的页面。

# 访问日志格式：**不含查询串**（SEC-02，2026-10-28）。
#
# nginx 默认的 combined 记录 $request，也就是含 query string 的完整 URI。
# WebSocket 鉴权曾把 access JWT 放在 ?token= 里，等于把 24 小时有效的凭据
# 明文写进 access.log，并被 `docker compose logs teacher-web` 带出来。
# 这里改用 $uri（路径，不含参数）。即使将来又有人把凭据塞进查询串，
# 它也不会落盘。
log_format safe '$remote_addr - $remote_user [$time_local] '
                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/access.log safe;

    # ── 策略定义（全文唯一一份）────────────────────────────────────────
    #
    # script-src 'self' 'unsafe-eval'
    #   'unsafe-eval' 是**真实依赖**：ECharts 在运行时执行
    #   new Function("tag", ...) 探测自定义元素
    #   （dist/assets/echarts-vendor-*.js 的 aC()）。去掉它，Dashboard/Trends
    #   的图表直接不渲染。构建产物里没有内联 <script>，所以不需要
    #   'unsafe-inline' 给 script-src。
    #   ⚠ 这是一条**放宽**：它把 XSS 的后果从"执行注入脚本"提升到"任意代码"。
    #   之所以仍然接受，是因为 ECharts 的这段调用包在 try/catch 里探测能力，
    #   当前版本没有 nonce/native-Element 的替代路径。**待验证的改进方向**：
    #   升级到不依赖 new Function 的 vue-echarts 版本后可去掉。本轮没有做这个
    #   验证（需要真实浏览器跑图表用例），因此不把它写成"已收紧"。
    #
    # style-src 'self' 'unsafe-inline'
    #   真实依赖，三条都可在 dist 里复现：vue-echarts 模块顶层执行
    #   document.head.innerHTML += '<style>…'（innerHTML 解析的 <style> 无法带
    #   nonce）；Vue scoped style 与 antd 的动态样式走 CSSOM 注入。
    #
    # img/media/connect 里的 ${MACT_CSP_MEDIA_ORIGIN}
    #   证据帧与原视频都由 MinIO 预签名 URL 直接加载，host 是
    #   MACT_MINIO_PUBLIC_ENDPOINT。它随部署变化（基础栈 localhost:9000、
    #   容量栈 127.0.0.1:19000），所以必须注入而不是写死。
    #   connect-src 必须含它：上传是浏览器直接 PUT 到 MinIO。
    #   ws:// 同源属于 connect-src 'self' 的覆盖范围（现代浏览器把 ws:/wss:
    #   的同源请求算作 'self'）；若遇到极旧浏览器不认，需显式加 ws://host。
    #
    # 不含 upgrade-insecure-requests：本机部署是纯 HTTP，加它会把
    # http://localhost:9000 的证据帧请求升级成 https 并全部失败。
    # 该指令只在 TLS 部署时由 deploy/tls/ 的示例配置加上。
    set $mact_csp "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${MACT_CSP_MEDIA_ORIGIN}; media-src 'self' blob: ${MACT_CSP_MEDIA_ORIGIN}; connect-src 'self' ${MACT_CSP_MEDIA_ORIGIN}; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # 前端没有任何 getUserMedia / clipboard / geolocation 调用（全仓 grep 0 命中），
    # 因此全部显式 deny，而不是留空让浏览器用默认值。
    set $mact_permissions "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), screen-wake-lock=()";

    add_header Content-Security-Policy $mact_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $mact_permissions always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # HSTS 不在这里加。纯 HTTP 上浏览器会忽略它，加了只会让部署方以为
    # "HTTPS 已配好"。TLS 终止层的配置见 deploy/tls/README.md；那里才加
    # Strict-Transport-Security 与 http→https 跳转。

    # ------------------------------------------------------------------
    # API 反代
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 这里**不** hide 后端的 CSP：两条 CSP 同时到达时浏览器取交集，
        # 交集就是后端那条 `default-src 'none'`——JSON 响应该有的锁定语义
        # （见文件头第 2 点）。hide 掉反而只剩页面策略，更弱。
        # 也不在这里写 add_header：本 location 没有任何 add_header，
        # 因此完整继承 server 级那一套（这正是 add_header 全有或全无的用法）。
    }

    # socket.io 在当前前端没有使用者（package.json 无 socket.io-client，
    # src 下 0 命中）。保留转发是为了历史部署兼容，不是活跃路径。
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 双保险：格式已经不含查询串，这里再彻底关掉该 location 的访问日志。
        # WebSocket 握手是长连接入口，请求量低，排障靠应用日志足够；
        # 而凭据一旦落进 access.log 就无法收回。
        access_log off;

        # error_log 也必须收紧（实测发现，2026-10-28）。
        #
        # 此前只关了 access_log，但 nginx 的 error 级日志在**上游不可达**时会打印
        # 完整的 request 行与 upstream URL，两者都含查询串。实测（本机 1.27.4，
        # 把一个必然连不上的 upstream 接在 /ws/ 后面）：
        #
        #   [error] connect() failed (10061) while connecting to upstream,
        #     request: "GET /ws/classroom?lessonId=SECRETLESSON&ticket=deadbeef...",
        #     upstream: "http://127.0.0.1:9/api/ws/classroom?lessonId=...&ticket=..."
        #
        # 也就是说：后端重启/未就绪期间，票据会以明文进 error.log。票据只有
        # 60 秒且单次消费，危害远小于长期 JWT，但"日志里不该有凭据"这条不能
        # 靠"它反正快过期"来放宽。
        #
        # 修法：给本 location 单独指定 error_log，级别提到 crit。
        #   * crit 会滤掉所有 error 级（上游连接失败、超时）——正是会带 URI 的那类；
        #   * 仍保留 crit/alert/emerg（磁盘满、worker 异常）以便排障；
        #   * 实测确认：主 error.log 里 SECRETLESSON 出现 0 次，该文件大小 0 字节。
        # 不能用 `/dev/null`：nginx 在 Windows 上会把它当相对路径 E:/dev/null 并
        # 启动失败（实测 [emerg] CreateFile() "E:/dev/null" failed）。
        error_log /var/log/nginx/ws-error.log crit;
    }

    # 带哈希指纹的构建产物：内容不变则文件名不变，可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        # 本 location 自己写了 add_header，因此**必须**重复整套（而且引用的
        # 是同一个 $mact_csp 变量，不会与 server 级漂移）。
        add_header Content-Security-Policy $mact_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy $mact_permissions always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # SPA 入口：未知路径回落到 index.html，交给 vue-router。
        try_files $uri $uri/ /index.html;
        # index.html 引用的是带哈希的 assets，自身不能被长期缓存，
        # 否则发布后用户会拿到旧 HTML + 已删除的 JS 文件名。
        add_header Content-Security-Policy $mact_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy $mact_permissions always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }
}
